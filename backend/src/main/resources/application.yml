spring:
  application:
    name: spec2test-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/spec2test}
    username: ${SPRING_DATASOURCE_USERNAME:spec2test}
    password: ${SPRING_DATASOURCE_PASSWORD:spec2test}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 250MB
  mvc:
    async:
      request-timeout: -1
  http:
    clients:
      imperative:
        connect-timeout: 10s
        read-timeout: 30m
  ai:
    model:
      chat: ${SPEC2TEST_LLM_PROVIDER:ollama}
      embedding: ${SPEC2TEST_EMBEDDING_PROVIDER:ollama}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        options:
          model: ${SPEC2TEST_EMBEDDING_MODEL:nomic-embed-text}
      init:
        pull-model-strategy: never
    openai:
      api-key: ${OPENAI_API_KEY:}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

spec2test:
  llm:
    provider: ${SPEC2TEST_LLM_PROVIDER:ollama}
    text-model: ${SPEC2TEST_TEXT_MODEL:qwen3-coder:30b}
    vision-model: ${SPEC2TEST_VISION_MODEL:qwen2.5vl:32b}
    num-ctx: 65536
    sections-num-ctx: 131072
    temperature: 0.2
    call-timeout: 30m
    keep-alive: 10m
    max-validate-retries: 3
    page-render-dpi: 150
    rag-top-k: ${SPEC2TEST_RAG_TOP_K:6}
